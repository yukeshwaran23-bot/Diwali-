<div class="app">

</div>

<div class="drawer-head"><span>Process Management</span><button class="icon-btn" id="menuClose" aria-label="Close menu">×</button></div>
<button class="drawer-link" data-route="overall"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M22 19V8"/></svg><span>Overall</span><span>›</span></button>
<button class="drawer-link" data-route="sharing"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.6 6.6-4.2M8.7 13.4l6.6 4.2"/></svg><span>Sharing</span><span>›</span></button>
</aside>
<div class="modal-overlay" id="modalOverlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Add Weaver</h2><button class="close-btn" id="modalClose" aria-label="Close">×</button></div><form id="recordForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="secondary-btn" id="modalCancel">Cancel</button><button type="submit" class="primary-btn" id="formSubmit">Save</button></div></form></section></div>
<div class="modal-overlay" id="filterOverlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="filterTitle"><div class="modal-head"><h2 id="filterTitle">Filter by Amount</h2><button class="close-btn" id="filterClose" aria-label="Close">×</button></div><div class="form-grid"><label class="filter-choice"><input type="radio" name="sort" value="recent" checked> Recent Added</label><label class="filter-choice"><input type="radio" name="sort" value="high"> Amount: High to Low</label><label class="filter-choice"><input type="radio" name="sort" value="low"> Amount: Low to High</label></div><div class="modal-actions"><button class="secondary-btn" id="filterCancel">Cancel</button><button class="primary-btn" id="filterApply">Apply</button></div></section></div>

<div class="toast" id="toast" role="status"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNrTFIWKG33y7j6G2DVGAsjQnlzXTmIL4",
  authDomain: "diwali-6d935.firebaseapp.com",
  projectId: "diwali-6d935",
  storageBucket: "diwali-6d935.firebasestorage.app",
  messagingSenderId: "289984577376",
  appId: "1:289984577376:web:0808f0f372e0e573c76805",
  measurementId: "G-7CK7J6N6CZ"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
// Cloud document path: processManagement/main. Firestore rules must allow this exact document path.
let cloudReady = false;
let cloudSaveTimer = null;
let loadingCloud = false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(Number(n)||0);
const money=n=>'₹ '+fmt(n);
const state={
 page:'weavers',editing:null,menuRecord:null,sort:{weavers:'recent',partys:'recent',others:'recent'},query:{weavers:'',partys:'',others:''},
 data:{
  weavers:[{id:1,name:'Manikandan P',looms:3,amount:1500},{id:2,name:'Ramesh R',looms:2,amount:1200},{id:3,name:'Srinivasan',looms:4,amount:1300},{id:4,name:'Lakshmi',looms:2,amount:1000}],
  partys:[{id:1,name:'Ramkumar',amount:800},{id:2,name:'Suresh',amount:1200}],
  others:[{id:1,name:'Transport',amount:1500},{id:2,name:'Workers',amount:1200},{id:3,name:'Materials',amount:900},{id:4,name:'Miscellaneous',amount:1400}]
 },
 shareCount:6,shares:Array.from({length:6},(_,i)=>({name:['Srini','Raj','Kumar','Siva','Thaso','Peter'][i],percent:[10,10,30,20,20,10][i]})),shareCreated:false
};
// Persist records and sharing settings across page refreshes and browser restarts.
const STORAGE_KEY='processManagementData_v1';
try{
 const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
 if(saved && saved.data){
  for(const k of ['weavers','partys','others']){
   if(Array.isArray(saved.data[k])){
    state.data[k]=saved.data[k].map((r,i)=>({
     ...r,
     id:Number(r.id)||i+1,
     name:String(r.name??''),
     amount:Number(r.amount)||0,
     addedAt:Number(r.addedAt)||Number(r.id)||Date.now()
    }));
   }
  }
  if(Array.isArray(saved.shares)) state.shares=saved.shares;
  if(Number.isFinite(Number(saved.shareCount))) state.shareCount=Math.max(1,Math.min(100,Number(saved.shareCount)));
  state.shareCreated=Boolean(saved.shareCreated);
 }
}catch(error){
 console.warn('Could not load saved Process Management data:',error);
}
function localSnapshot(){return {data:state.data,shares:state.shares,shareCount:state.shareCount,shareCreated:state.shareCreated};}
function saveState(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(localSnapshot()));}
 catch(error){console.error('Could not save local backup:',error);toast('Local backup failed. Check browser storage settings.');}
 if(cloudReady && !loadingCloud){
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>persistCloudState(),450);
 }
 return true;
}
async function persistCloudState(showSuccess=false){
 if(!cloudReady || loadingCloud)return;
 try{
  await setDoc(doc(db,'processManagement','main'),{...localSnapshot(),updatedAt:serverTimestamp()});
  if(showSuccess)toast('Firebase data saved successfully');
 }catch(error){
  console.error('Firebase save failed:',error);
  toast(firebaseErrorMessage(error));
 }
}
function firebaseErrorMessage(error){
 const code=error?.code||'';
 if(code.includes('permission-denied'))return 'Firebase access denied. In Firestore → Rules, publish rules for /processManagement/main. The site is using local backup until cloud access is allowed.';
 if(code.includes('unavailable'))return 'Firebase is unavailable. Check your internet connection.';
 if(code.includes('network'))return 'Network error. Check your internet connection.';
 return error?.message || 'Firebase error. Check your Firebase setup.';
}
async function loadCloudData(){
 loadingCloud=true;cloudReady=false;
 try{
  const ref=doc(db,'processManagement','main');
  const snap=await getDoc(ref);
  if(snap.exists()){
   const saved=snap.data();
   for(const k of ['weavers','partys','others'])if(Array.isArray(saved.data?.[k]))state.data[k]=saved.data[k].map((r,i)=>({...r,id:Number(r.id)||i+1,name:String(r.name??''),amount:Number(r.amount)||0,addedAt:Number(r.addedAt)||Number(r.id)||Date.now()}));
   if(Array.isArray(saved.shares))state.shares=saved.shares;
   if(Number.isFinite(Number(saved.shareCount)))state.shareCount=Math.max(1,Math.min(100,Number(saved.shareCount)));
   state.shareCreated=Boolean(saved.shareCreated);
  }else{
   // First connection: upload this browser's saved data (or the initial sample data).
   await setDoc(ref,{...localSnapshot(),updatedAt:serverTimestamp()});
  }
  localStorage.setItem(STORAGE_KEY,JSON.stringify(localSnapshot()));
  cloudReady=true;
 }catch(error){
  console.error('Firebase load failed:',error);
  cloudReady=false;
  toast(firebaseErrorMessage(error));
  throw error;
 }finally{loadingCloud=false;}
}
const categoryLabel={weavers:'Weaver',partys:'Party',others:'Other'};
const titleCase=k=>({weavers:'Weavers',partys:'Partys',others:'Others'}[k]||k);
const totalCategory=k=>state.data[k].reduce((s,r)=>s+Number(r.amount||0),0);
const grandTotal=()=>['weavers','partys','others'].reduce((s,k)=>s+totalCategory(k),0);
function updateTop(){ $('#topTotal').textContent=money(grandTotal()); }
function summaryMetric(label,value){return `<div class="metric"><span class="metric-label">${label}</span><div class="metric-value">${value}</div></div>`}
function renderCategory(k){
 const isW=k==='weavers',query=state.query[k].toLowerCase();
 let rows=state.data[k].filter(r=>r.name.toLowerCase().includes(query));
 if(state.sort[k]==='recent')rows.sort((a,b)=>(Number(b.addedAt)||Number(b.id)||0)-(Number(a.addedAt)||Number(a.id)||0));
 if(state.sort[k]==='high')rows.sort((a,b)=>Number(b.amount||0)-Number(a.amount||0));
 if(state.sort[k]==='low')rows.sort((a,b)=>Number(a.amount||0)-Number(b.amount||0));
 const search=`<div class="toolbar"><label class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><input type="search" id="searchInput" placeholder="Search ${isW?'weaver':k==='partys'?'party':'others'} name..." value="${escapeHtml(state.query[k])}" aria-label="Search ${titleCase(k)}"></label><button class="filter-btn" id="filterOpen"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6.2 7.2v5.1l-3.6 1.8v-6.9z"/></svg>Filter</button></div>`;
 const summary=`<section class="summary ${isW?'':'two'}">${isW?summaryMetric('Total weavers',state.data.weavers.length)+summaryMetric('Looms',fmt(state.data.weavers.reduce((s,r)=>s+Number(r.looms||0),0)))+summaryMetric('Amount',money(totalCategory(k))):summaryMetric(k==='partys'?'Total Party':'Total Others',state.data[k].length)+summaryMetric('Total amount',money(totalCategory(k)))}</section>`;
 const cards=rows.length?`<div class="list">${rows.map((r,i)=>`<article class="item" style="animation-delay:${Math.min(i,8)*35}ms"><div><div class="item-name">${escapeHtml(r.name)}</div>${isW?`<div class="item-sub">${fmt(r.looms)} ${Number(r.looms)===1?'loom':'looms'}</div>`:''}</div><div class="item-amount">${money(r.amount)}</div><button class="more-btn" data-more="${k}:${r.id}" aria-label="Actions for ${escapeHtml(r.name)}">⋮</button></article>`).join('')}</div>`:`<div class="empty"><strong>${query?'No matching records':'No records yet'}</strong>${query?'Try another search.':'Tap + to add your first '+categoryLabel[k].toLowerCase()+'.'}</div>`;
 return `<section class="page" data-current="${k}">${search}${summary}${cards}</section>`;
}
function renderOverall(){
 const w=state.data.weavers.length,looms=state.data.weavers.reduce((s,r)=>s+Number(r.looms||0),0),p=state.data.partys.length,o=state.data.others.length;
 return `<section class="page"><h1 class="overall-title">Overall</h1><div class="overall-stack">
 <section class="overall-card"><h3>Total Weavers</h3><div class="summary">${summaryMetric('Weavers',w)}${summaryMetric('Looms',fmt(looms))}${summaryMetric('Amount',money(totalCategory('weavers')))}</div></section>
 <section class="overall-card party"><h3>Total Partys</h3><div class="summary two">${summaryMetric('Partys',p)}${summaryMetric('Amount',money(totalCategory('partys')))}</div></section>
 <section class="overall-card other"><h3>Total Others</h3><div class="summary two">${summaryMetric('Others',o)}${summaryMetric('Amount',money(totalCategory('others')))}</div></section>
 <div class="grand-total"><span>Total Amount</span><strong>${money(grandTotal())}</strong></div></div></section>`;
}
function renderSharing(){
 const total=grandTotal();
 const rows=state.shareCreated?state.shares.map((p,i)=>`<tr><td>${i+1}</td><td><input aria-label="Person ${i+1} name" data-share-name="${i}" value="${escapeHtml(p.name)}" placeholder="Person name"></td><td><input aria-label="Person ${i+1} percentage" data-share-percent="${i}" type="number" min="0" max="100" step="0.01" value="${p.percent}"></td><td class="share-amount">${money(total*(Number(p.percent)||0)/100)}</td><td><button class="more-btn" data-share-more="${i}" aria-label="Person actions">⋮</button></td></tr>`).join(''):'';
 const pct=state.shares.reduce((s,p)=>s+(Number(p.percent)||0),0);
 return `<section class="page"><h1 class="section-title">Sharing</h1><div class="sharing-total"><span>Total Amount</span><strong>${money(total)}</strong></div>
 <div class="setup-card"><label class="field-label">Number of persons</label><div class="count-control"><button id="countMinus" aria-label="Decrease people">−</button><output>${state.shareCount}</output><button id="countPlus" aria-label="Increase people">+</button></div><button class="primary-btn full" id="createShares">${state.shareCreated?'Update People':'Create'}</button></div>
 ${state.shareCreated?`<div class="share-table-wrap"><table class="share-table"><thead><tr><th>No.</th><th>Name</th><th>Percentage (%)</th><th>Amount (₹)</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="share-total-row"><span>Total</span><span>${fmt(pct)}%</span><span>${money(total*pct/100)}</span></div><div class="share-actions"><button class="secondary-btn" id="resetShares">Reset</button><button class="primary-btn" id="saveShares">Save</button></div><p class="hint">Each amount is calculated from the common total. Percentages should add up to 100% to allocate the full amount.</p><div id="shareNote" class="status-note ${Math.abs(pct-100)<.001?'hidden':''}">Current percentage total is ${fmt(pct)}%. Adjust it to 100% to allocate the full amount.</div>`:''}</section>`;
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 updateTop();$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 $('#main').innerHTML=state.page==='overall'?renderOverall():state.page==='sharing'?renderSharing():renderCategory(state.page);
 bindPage();
}
function bindPage(){
 const search=$('#searchInput');if(search)search.addEventListener('input',e=>{const el=e.target, pos=el.selectionStart;state.query[state.page]=el.value;const y=window.scrollY;render();const next=$('#searchInput');next.focus();next.setSelectionRange(pos,pos);window.scrollTo(0,y)});
 $('#filterOpen')?.addEventListener('click',openFilter);
 $$('.more-btn[data-more]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const [k,id]=b.dataset.more.split(':');openContext(b,{type:'record',k,id:Number(id)})}));
 $('#countMinus')?.addEventListener('click',()=>resizeShares(Math.max(1,state.shareCount-1)));
 $('#countPlus')?.addEventListener('click',()=>resizeShares(Math.min(100,state.shareCount+1)));
 $('#createShares')?.addEventListener('click',()=>{state.shareCreated=true;saveState();render();toast('Sharing table ready')});
 $('#resetShares')?.addEventListener('click',()=>{state.shares=state.shares.map(p=>({...p,percent:0}));saveState();render()});
 $('#saveShares')?.addEventListener('click',()=>{const pct=state.shares.reduce((s,p)=>s+(Number(p.percent)||0),0);if(Math.abs(pct-100)>.001){toast('Percentages must total 100%');return}saveState();toast('Sharing allocation saved')});
 $$('[data-share-name]').forEach(inp=>inp.addEventListener('change',()=>{state.shares[Number(inp.dataset.shareName)].name=inp.value;saveState()}));
 $$('[data-share-percent]').forEach(inp=>inp.addEventListener('input',()=>{const i=Number(inp.dataset.sharePercent);state.shares[i].percent=Math.max(0,Math.min(100,Number(inp.value)||0));saveState();const tr=inp.closest('tr');tr.querySelector('.share-amount').textContent=money(grandTotal()*state.shares[i].percent/100);const pct=state.shares.reduce((s,p)=>s+(Number(p.percent)||0),0);$('.share-total-row span:nth-child(2)').textContent=fmt(pct)+'%';$('.share-total-row span:nth-child(3)').textContent=money(grandTotal()*pct/100);const note=$('#shareNote');if(note){note.classList.toggle('hidden',Math.abs(pct-100)<.001);note.textContent=`Current percentage total is ${fmt(pct)}%. Adjust it to 100% to allocate the full amount.`}}));
 $('#resetShares')?.addEventListener('click',()=>toast('Percentages reset'));
 $$('[data-share-more]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const i=Number(b.dataset.shareMore);openContext(b,{type:'share',i})}));
}
function resizeShares(n){const old=state.shares;state.shareCount=n;state.shares=Array.from({length:n},(_,i)=>old[i]||{name:'',percent:0});saveState();render()}
function switchPage(k){state.page=k;closeDrawer();closeContext();render();window.scrollTo({top:0,behavior:'smooth'})}
$$('.tab').forEach(b=>b.addEventListener('click',()=>switchPage(b.dataset.page)));
$$('[data-route]').forEach(b=>b.addEventListener('click',()=>switchPage(b.dataset.route)));
$('#menuOpen').addEventListener('click',openDrawer);$('#menuClose').addEventListener('click',closeDrawer);$('#menuOverlay').addEventListener('click',closeDrawer);
function openDrawer(){$('#drawer').classList.add('open');$('#menuOverlay').classList.add('open')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#menuOverlay').classList.remove('open')}
$('#addMain').addEventListener('click',()=>openRecordModal());
function openRecordModal(k=state.page,record=null){
 if(!['weavers','partys','others'].includes(k)){toast('Choose a category first');return}
 state.editing=record?{k,id:record.id}:null;const label=categoryLabel[k],isW=k==='weavers';
 // Internal IDs stay unique; the visible number stays sequential after deletions.
 const nextId=Math.max(0,...state.data[k].map(r=>Number(r.id)||0))+1;
 const displayNo=record ? state.data[k].findIndex(r=>r.id===record.id)+1 : state.data[k].length+1;
 $('#modalTitle').textContent=(record?'Edit ':'Add ')+label;
 $('#formSubmit').textContent=record?'Update':'Save';
 const values=record||{id:nextId,name:'',looms:'',amount:''};
 $('#formFields').innerHTML=`<div class="form-field"><label for="recordNo">${label} No.</label><input id="recordNo" value="${displayNo}" readonly></div><div class="form-field"><label for="recordName">Name</label><input id="recordName" required maxlength="80" placeholder="Enter ${label.toLowerCase()} name" value="${escapeHtml(values.name)}"></div>${isW?`<div class="form-field"><label for="recordLooms">Looms</label><input id="recordLooms" type="number" required min="0" step="1" placeholder="Enter looms" value="${values.looms??''}"></div>`:''}<div class="form-field"><label for="recordAmount">Amount (₹)</label><input id="recordAmount" type="number" required min="0" step="0.01" placeholder="Enter amount" value="${values.amount??''}"></div>`;
 $('#modalOverlay').classList.add('open');setTimeout(()=>$('#recordName').focus(),120);
}
function closeRecordModal(){$('#modalOverlay').classList.remove('open');state.editing=null}
$('#modalClose').addEventListener('click',closeRecordModal);$('#modalCancel').addEventListener('click',closeRecordModal);$('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeRecordModal()});
$('#recordForm').addEventListener('submit',e=>{e.preventDefault();const k=state.editing?.k||state.page;if(!['weavers','partys','others'].includes(k))return;const id=state.editing?.id||Math.max(0,...state.data[k].map(r=>r.id))+1;const name=$('#recordName').value.trim(),amount=Number($('#recordAmount').value);if(!name||!Number.isFinite(amount)||amount<0){toast('Enter a name and valid amount');return}const record={id,name,amount};if(k==='weavers'){const looms=Number($('#recordLooms').value);if(!Number.isFinite(looms)||looms<0){toast('Enter a valid loom count');return}record.looms=looms}
 const idx=state.data[k].findIndex(r=>r.id===id);if(idx>=0){record.addedAt=state.data[k][idx].addedAt||Number(state.data[k][idx].id)||Date.now();state.data[k][idx]=record}else{record.addedAt=Date.now();state.data[k].push(record)}saveState();closeRecordModal();render();toast(idx>=0?'Record updated':'Record added')});
let contextData=null;
function openContext(anchor,data){contextData=data;const m=$('#contextMenu');m.classList.add('open');const r=anchor.getBoundingClientRect();const mw=160,mh=94;let left=Math.min(window.innerWidth-mw-10,Math.max(10,r.right-mw));let top=r.bottom+4;if(top+mh>window.innerHeight)top=Math.max(10,r.top-mh-4);m.style.left=left+'px';m.style.top=top+'px';$('#editAction').textContent=data.type==='share'?'Edit person':'Edit';$('#deleteAction').textContent=data.type==='share'?'Remove person':'Delete'}
function closeContext(){ $('#contextMenu').classList.remove('open');contextData=null}
document.addEventListener('click',e=>{if(!e.target.closest('#contextMenu')&&!e.target.closest('[data-more]')&&!e.target.closest('[data-share-more]'))closeContext()});
$('#editAction').addEventListener('click',()=>{if(!contextData)return;const d=contextData;closeContext();if(d.type==='record'){const r=state.data[d.k].find(x=>x.id===d.id);if(r)openRecordModal(d.k,r)}else{toast('Edit the person name or percentage directly in the table')}});
$('#deleteAction').addEventListener('click',()=>{if(!contextData)return;const d=contextData;closeContext();if(d.type==='record'){const r=state.data[d.k].find(x=>x.id===d.id);if(!r)return;if(confirm(`Delete "${r.name}"? This deletion will be saved locally and synced to Firebase when cloud access is enabled.`)){state.data[d.k]=state.data[d.k].filter(x=>x.id!==d.id);saveState();render();toast('Record deleted')}}else{if(confirm('Remove this person from sharing?')){state.shares.splice(d.i,1);state.shareCount=Math.max(1,state.shareCount-1);saveState();render()}}});
function openFilter(){const selected=state.sort[state.page]||'recent';const radio=$(`input[name="sort"][value="${selected}"]`);if(radio)radio.checked=true;$('#filterOverlay').classList.add('open')}
function closeFilter(){$('#filterOverlay').classList.remove('open')}
$('#filterClose').addEventListener('click',closeFilter);$('#filterCancel').addEventListener('click',closeFilter);$('#filterOverlay').addEventListener('click',e=>{if(e.target===$('#filterOverlay'))closeFilter()});
$('#filterApply').addEventListener('click',()=>{const v=$('input[name="sort"]:checked').value;state.sort[state.page]=v;closeFilter();render();toast(v==='recent'?'Sorted: recent added':v==='high'?'Sorted: high to low':'Sorted: low to high')});
let toastTimer;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeRecordModal();closeFilter();closeContext()}});
// Start directly in the app without a sign-in screen.
(async()=>{
 try{
  await loadCloudData();
  render();
  toast('Connected to Firebase');
 }catch(error){
  // Keep the interface usable with local storage if Firebase rules/config are not ready.
  render();
 }
})();
</script>
</body>
</html>
